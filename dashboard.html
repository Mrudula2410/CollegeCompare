<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>College Compare Dashboard</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="/css files/dashboard.css" />
</head>


<body>

<div class="dashboard">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-graduation-cap"></i>

            <span>
                College Compare
            </span>

        </div>


        <div class="menu">

            <a href="/html files/homepage.html"
               class="menu-link">

                <i class="fa-solid fa-house"></i>

                <span>
                    Home
                </span>

            </a>


            <a href="/html files/profile.html"
               class="menu-link">

                <i class="fa-regular fa-user"></i>

                <span>
                    Profile
                </span>

            </a>


         

        </div>


       <a href="/html files/homepage.html"
   class="logout"
   id="logoutBtn">

            <i class="fa-solid fa-right-from-bracket"></i>

            <span>
                Logout
            </span>

        </a>

    </aside>



    <!-- ================= MAIN CONTENT ================= -->

    <section class="main-content">


        <!-- ================= HEADER ================= -->

        <header class="header">

            <div class="welcome">

                <h1>
                    Hello👋
                </h1>

                <p>
                    Let's find the best college for your future.
                </p>

            </div>

        </header>



       
        <!-- ================= QUICK ACTIONS ================= -->

        <div class="top-section">

            <div class="card quick-actions">

                <h2>
                    Quick Actions
                </h2>

                <p>
                    Quickly access important features.
                </p>


                <div class="buttons">

                    <a href="/html files/college.html">

                        <i class="fa-solid fa-magnifying-glass"></i>

                        Find Colleges

                    </a>


                    <a href="/html files/compare.html"
                       class="outline-btn">

                        <i class="fa-solid fa-code-compare"></i>

                        Compare Colleges

                    </a>

                </div>

            </div>

        </div>



        <!-- ================= SAVED COLLEGES ================= -->

        <section class="section">

            <div class="section-heading">

                <h2>
                    Saved Colleges
                </h2>

            </div>


            <!-- IMPORTANT:
                 DO NOT ADD COLLEGE CARDS HERE.
                 dashboard.js will create them automatically.
            -->

            <div
                class="college-container"
                id="savedCollegesContainer"
            >

                <!-- Saved colleges generated by dashboard.js -->

            </div>

        </section>



        <!-- ================= RECENT COMPARISONS ================= -->

        


    </section>

</div>



<!-- ================= DASHBOARD JS ================= -->

<script src="/js files/dashboard.js"></script>

</body>

</html>
