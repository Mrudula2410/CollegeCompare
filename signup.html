<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sign Up - College Compare</title>

    <link rel="stylesheet"
        href="/css files/login.css">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Create Account</h1>

        <p>Join College Compare</p>

        <form id="signupForm">

            <input
                type="text"
                id="signupName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                required
            >

            <p id="signupMessage"></p>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="signup-text">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="/js files/signup.js"></script>

</body>
</html>
