<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CollegeCompare - Compare Colleges</title>

    <link rel="stylesheet"
          href="/css files/compare.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">

        🎓 <span class="clg">College</span><span class="cmp">Compare</span>

    </div>


    <div class="nav-links">

        <a href="/html files/homepage.html">Home</a>

       <a href="/html files/college.html">Colleges</a>

        <a href="/html files/compare.html">Compare</a>

        <a href="/html files/dashboard.html">Dashboard</a>

    </div>


   

</nav>



<!-- ================= MAIN ================= -->

<main class="main-container">


    <!-- PAGE HEADING -->

    <div class="page-heading">

        <h1>
            Compare Colleges
        </h1>

        <p>
            Add up to 3 colleges to compare
        </p>

    </div>



    <!-- ================= TOP AREA ================= -->

    <div class="top-area">


        <!-- SELECTED COLLEGES -->

        <div id="selectedColleges"
             class="selected-colleges">

            <!-- Colleges will appear here -->

        </div>



        <!-- ADD COLLEGE -->

        <div class="add-wrapper">

            <button id="addCollegeBtn"
                    class="add-btn"
                    type="button">

                <span>+</span>
                Add College

            </button>



            <!-- DRAWER -->

            <div id="collegeMenu"
                 class="college-menu">


                <div class="drawer-header">

                    <strong>
                        Select College
                    </strong>

                    <button id="closeDrawer"
                            type="button">

                        ×

                    </button>

                </div>


                <div id="collegeList">


                </div>


            </div>

        </div>

    </div>



    <!-- ================= COMPARISON CARD ================= -->

    <section class="comparison-card">


        <div class="table-wrapper">


            <table id="comparisonTable">


                <thead>

                    <!-- JS -->

                </thead>


                <tbody>

                    <!-- JS -->

                </tbody>


            </table>


        </div>


    </section>
</main>



<script src="/js files/compare.js"></script>


</body>

</html>
